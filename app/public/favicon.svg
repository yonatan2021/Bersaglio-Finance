<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="7" fill="#1a3354"/>
  <!-- Compass circle -->
  <circle cx="16" cy="16" r="10" stroke="#ffffff" stroke-width="1.2" fill="none" opacity="0.3"/>
  <!-- North needle (white) -->
  <polygon points="16,5 14,16 16,14 18,16" fill="#ffffff"/>
  <!-- South needle (silver) -->
  <polygon points="16,27 14,16 16,18 18,16" fill="#8a9bb5"/>
  <!-- East needle (silver) -->
  <polygon points="27,16 16,14 18,16 16,18" fill="#8a9bb5" opacity="0.7"/>
  <!-- West needle (white) -->
  <polygon points="5,16 16,14 14,16 16,18" fill="#ffffff" opacity="0.7"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.5" fill="#ffffff"/>
</svg>
